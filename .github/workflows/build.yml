{
"name": "Compiler APK",
"on": {"push": {"branches": ["main", "master"]}, "workflow_dispatch": {}},
"permissions": {"contents": "write"},
"jobs": {"build": {"runs-on": "ubuntu-latest", "steps": [
{"uses": "actions/checkout@v4"},
{"uses": "actions/setup-java@v4", "with": {"distribution": "temurin", "java-version": "17"}},
{"uses": "gradle/actions/setup-gradle@v4", "with": {"gradle-version": "8.9"}},
{"name": "Assembler le projet", "run": "bash assemble.sh"},
{"name": "Compiler", "run": "gradle -p projet assembleDebug --no-daemon --stacktrace"},
{"name": "Renommer", "run": "cp projet/app/build/outputs/apk/debug/app-debug.apk Clavier-FR-AR.apk"},
{"uses": "actions/upload-artifact@v4", "with": {"name": "Clavier-FR-AR", "path": "Clavier-FR-AR.apk"}},
{"uses": "softprops/action-gh-release@v2", "with": {"tag_name": "v${{ github.run_number }}", "name": "Clavier FR-AR ${{ github.run_number }}", "files": "Clavier-FR-AR.apk"}}
]}}
}
