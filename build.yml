name: Compiler l'APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les fichiers
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assembler le projet Android à partir des fichiers à plat
        run: |
          set -e
          P=projet
          J=$P/app/src/main/java/com/mahmoh/clavier
          R=$P/app/src/main/res
          mkdir -p "$J" "$R/xml" "$R/drawable"
          cp ClavierService.java MainActivity.java "$J/"
          cp AndroidManifest.xml "$P/app/src/main/"
          cp method.xml "$R/xml/"
          cp ic_*.xml "$R/drawable/"

          cat > $P/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'ClavierFrAr'
          include ':app'
          EOF

          cat > $P/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > $P/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          EOF

          cat > $P/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.mahmoh.clavier'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.mahmoh.clavier'
                  minSdk 23
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
                  encoding 'UTF-8'
              }
          }
          EOF

      - name: Accepter les licences du SDK Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Compiler l'APK
        run: gradle -p projet assembleDebug --no-daemon --stacktrace

      - name: Renommer l'APK
        run: cp projet/app/build/outputs/apk/debug/app-debug.apk Clavier-FR-AR.apk

      - name: Conserver l'APK (onglet Actions)
        uses: actions/upload-artifact@v4
        with:
          name: Clavier-FR-AR
          path: Clavier-FR-AR.apk

      - name: Publier l'APK (onglet Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Clavier FR-AR — version ${{ github.run_number }}
          files: Clavier-FR-AR.apk
